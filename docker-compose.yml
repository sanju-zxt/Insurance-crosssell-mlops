services:
  api:
    build: .
    image: xsell-api:local
    container_name: xsell-api
    ports:
      - "8000:8000"
    environment:
      XSELL_MODEL_PATH: /app/models/model.joblib
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else sys.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: xsell-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlruns:/mlflow
    restart: unless-stopped
