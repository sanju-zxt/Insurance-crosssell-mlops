[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsell"
version = "1.0.0"
description = "Insurance cross-sell propensity: reproducible train, serve and monitor pipeline"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanju" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "imbalanced-learn>=0.12,<1",
    "joblib>=1.4,<2",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14,<3"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
